server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single page application: unknown paths fall through to index.html so that
    # react-router can handle /dashboard, /profile, ... on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
